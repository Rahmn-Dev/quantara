[project]
name = "quantara-idx"
version = "0.1.0"
description = "Deterministic-first IDX quant research and trading decision dashboard"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6",
  "djangorestframework>=3.15,<4",
  "channels[daphne]>=4.2,<5",
  "channels-redis>=4.2,<5",
  "celery[redis]>=5.5,<6",
  "django-environ>=0.12,<1",
  "psycopg[binary]>=3.2,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "yfinance>=0.2.65,<1",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-django>=4.9", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "trading*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["RUF012"]
