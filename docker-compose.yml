services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantara}
      POSTGRES_USER: ${POSTGRES_USER:-quantara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quantara}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
    volumes:
      - model_artifacts:/app/artifacts
      - static_files:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=1"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quantara}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - model_artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quantara}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  model_artifacts:
  static_files:
  celery_beat_data:
